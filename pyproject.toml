[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lazyforge"
version = "1.0.0"
description = "Agent 工具库按需检索与延迟加载网关：语义检索 + defer_loading + 上下文预算，零依赖纯 Python"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "智能交付知识工程组" }]
keywords = ["agent", "tool-retrieval", "defer-loading", "context-budget", "llm", "mcp"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]

[project.scripts]
lazyforge = "lazyforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lazyforge = ["py.typed"]
